name: Daily Stock Price Bot

on:
  schedule:
    # 05:30 UTC = 12:30 Việt Nam (Thứ 2 - Thứ 6)
    - cron: '30 5 * * 1-5'
    # 09:00 UTC = 16:00 Việt Nam (Thứ 2 - Thứ 6)
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # Nút bấm chạy tay trên giao diện GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Cache pip store

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python auto_stock.py

      - name: Notify Failure via Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ERROR_MSG="⚠️ **CẢNH BÁO: CRAWL GIÁ CỔ PHIẾU THẤT BẠI!** ⚠️%0A%0A📌 **Workflow:** $GITHUB_WORKFLOW%0A🔗 **Chi tiết lỗi:** https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${ERROR_MSG}" \
            -d "parse_mode=Markdown"